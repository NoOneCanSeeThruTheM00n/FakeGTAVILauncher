name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ""
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set release version
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -like "refs/tags/*") {
            if ($refName -notmatch '^v\.?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
              throw "Release tag '$refName' must use vMAJOR.MINOR.PATCH format, for example v0.1.0."
            }
            $version = $matches[1]
          } else {
            $version = "0.1.0"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          $jsonFiles = @(
            "package.json",
            "gta-vi-splash-main-app/package.json",
            "src-tauri/tauri.conf.json",
            "gta-vi-splash-main-app/src-tauri/tauri.conf.json"
          )
          foreach ($file in $jsonFiles) {
            $json = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            $json.version = $version
            $json | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $file -Encoding UTF8
          }

          $cargoFiles = @(
            "src-tauri/Cargo.toml",
            "gta-vi-splash-main-app/src-tauri/Cargo.toml"
          )
          foreach ($file in $cargoFiles) {
            $content = Get-Content -LiteralPath $file -Raw
            $content = [regex]::Replace(
              $content,
              '(?m)^version\s*=.*$',
              "version = `"$version`""
            )
            Set-Content -LiteralPath $file -Value $content -Encoding UTF8
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            gta-vi-splash-main-app/src-tauri -> target

      - name: Install WebView2 build prerequisites
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            throw "Rust is not available"
          }

      - name: Build splash executable
        working-directory: gta-vi-splash-main-app
        run: |
          $videos = @(
            "src/assets/boot-screen.mov",
            "src/assets/in-game-screen.mov"
          )
          foreach ($video in $videos) {
            if (-not (Test-Path $video) -or (Get-Item $video).Length -lt 1MB) {
              throw "Git LFS video asset is missing or incomplete: $video"
            }
          }
          npm ci
          npm run tauri -- build --no-bundle
          $built = "src-tauri/target/release/gta-vi-splash.exe"
          if (-not (Test-Path $built)) {
            throw "Splash executable was not built: $built"
          }
          Move-Item -LiteralPath $built -Destination "src-tauri/target/release/Grand Theft Auto VI.exe" -Force

      - name: Copy splash executable into launcher resources
        shell: pwsh
        run: |
          $source = "gta-vi-splash-main-app/src-tauri/target/release/Grand Theft Auto VI.exe"
          if (-not (Test-Path $source)) {
            throw "Splash executable was not built: $source"
          }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item -LiteralPath $source -Destination "src-tauri/resources/gta-vi-splash.exe" -Force

      - name: Install launcher dependencies
        run: npm ci

      - name: Build launcher installer
        run: npm run tauri -- build --bundles nsis

      - name: Package portable launcher
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $releaseDir = "release"
          $portableDir = Join-Path $releaseDir "FakeGTAVILauncher-Portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          $launcher = "src-tauri/target/release/fake-gta-vi-launcher.exe"
          if (-not (Test-Path $launcher)) {
            throw "Launcher executable was not built: $launcher"
          }

          Copy-Item -LiteralPath $launcher -Destination $portableDir -Force
          Copy-Item -LiteralPath "src-tauri/resources/gta-vi-splash.exe" -Destination (Join-Path $portableDir "Grand Theft Auto VI.exe") -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $portableDir "resources") | Out-Null
          Copy-Item -LiteralPath "src-tauri/resources/gta-vi-splash.exe" -Destination (Join-Path $portableDir "resources/Grand Theft Auto VI.exe") -Force

          $portableZip = "release/FakeGTAVILauncher-$version-Portable.zip"
          if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $setup) {
            throw "NSIS setup executable was not built"
          }
          Copy-Item -LiteralPath $setup.FullName -Destination "release/FakeGTAVILauncher-$version-Setup.exe" -Force

      - name: Attest release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FakeGTAVILauncher-${{ env.RELEASE_VERSION }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fake GTA VI Launcher ${{ env.RELEASE_VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip

  build-linux:
    needs: build-and-release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set release version
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -like "refs/tags/*") {
            if ($refName -notmatch '^v\.?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
              throw "Release tag '$refName' must use vMAJOR.MINOR.PATCH format, for example v0.1.0."
            }
            $version = $matches[1]
          } else {
            $version = "0.1.0"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          $jsonFiles = @(
            "package.json",
            "gta-vi-splash-main-app/package.json",
            "src-tauri/tauri.conf.json",
            "gta-vi-splash-main-app/src-tauri/tauri.conf.json"
          )
          foreach ($file in $jsonFiles) {
            $json = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            $json.version = $version
            $json | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $file -Encoding UTF8
          }

          $cargoFiles = @(
            "src-tauri/Cargo.toml",
            "gta-vi-splash-main-app/src-tauri/Cargo.toml"
          )
          foreach ($file in $cargoFiles) {
            $content = Get-Content -LiteralPath $file -Raw
            $content = [regex]::Replace(
              $content,
              '(?m)^version\s*=.*$',
              "version = `"$version`""
            )
            Set-Content -LiteralPath $file -Value $content -Encoding UTF8
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gta-vi-splash-main-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            gta-vi-splash-main-app/src-tauri -> target

      - name: Install Linux build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            librsvg2-dev \
            wget \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            zip

      - name: Build native splash executable
        working-directory: gta-vi-splash-main-app
        run: |
          for video in src/assets/boot-screen.mov src/assets/in-game-screen.mov; do
            if [ ! -s "$video" ] || [ "$(stat -c%s "$video")" -lt 1048576 ]; then
              echo "Git LFS video asset is missing or incomplete: $video" >&2
              exit 1
            fi
          done
          npm ci
          npm run tauri -- build --no-bundle
          built="src-tauri/target/release/gta-vi-splash"
          test -f "$built"
          mv "$built" "src-tauri/target/release/Grand Theft Auto VI"

      - name: Stage native splash resource
        run: |
          mkdir -p src-tauri/resources
          install -m 755 "gta-vi-splash-main-app/src-tauri/target/release/Grand Theft Auto VI" \
            "src-tauri/resources/Grand Theft Auto VI"

      - name: Build Linux launcher packages
        run: |
          npm ci
          npm run tauri -- build --bundles appimage,deb

      - name: Package Linux portable build
        run: |
          version="$RELEASE_VERSION"
          portable="release/FakeGTAVILauncher-Portable"
          mkdir -p "$portable/resources" release
          install -m 755 src-tauri/target/release/fake-gta-vi-launcher \
            "$portable/fake-gta-vi-launcher"
          install -m 755 "src-tauri/resources/Grand Theft Auto VI" \
            "$portable/Grand Theft Auto VI"
          install -m 755 "src-tauri/resources/Grand Theft Auto VI" \
            "$portable/resources/Grand Theft Auto VI"
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/
          (cd "$portable" && zip -r "../FakeGTAVILauncher-$version-Portable-Linux.zip" .)

      - name: Attest Linux release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
            release/*.zip

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FakeGTAVILauncher-Linux-${{ env.RELEASE_VERSION }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.zip
          if-no-files-found: error

      - name: Publish Linux assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fake GTA VI Launcher ${{ env.RELEASE_VERSION }}
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.AppImage
            release/*.deb
            release/*.zip
